# Expert Sessions on one server. Four containers:
#   caddy   public https; issues certificates itself, including for a guru's own domain on demand
#   app     the api, serving the built web app; runs migrations on start; the scheduled jobs live here
#   db      Postgres 16 on a named volume
#   backup  a daily pg_dump into ./backups, fourteen days kept
# Copy .env.production.example to .env in this folder and fill it in, then: docker compose up -d --build
# Everything restarts on its own after a crash or a reboot.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://es:${POSTGRES_PASSWORD}@db:5432/expert_sessions
      TRUST_PROXY: "1"
      PUBLIC_HOST: ${PUBLIC_HOST}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: es
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: expert_sessions
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U es -d expert_sessions"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: es
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: expert_sessions
      KEEP_DAYS: "14"
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
