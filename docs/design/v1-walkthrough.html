<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expert Sessions — v1 walkthrough</title>
<style>
  :root{
    --paper:#E9EDEF; --panel:#FFFFFF; --ink:#16242C; --muted:#5A6B74;
    --line:#C9D3D8; --signal:#0F6E6A; --signal-soft:#DCEAE8;
    --warm:#B3622F; --warm-soft:#FBEFE5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:28px 22px 40px; line-height:1.5;
  }
  .wrap{max-width:1120px;margin:0 auto}

  header{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
  h1{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:27px;font-weight:600;letter-spacing:-.01em}
  header p{color:var(--muted);font-size:14px;margin-top:5px}

  nav{margin-bottom:22px;font-size:0}
  nav button{
    font:inherit;font-size:13.5px;cursor:pointer;margin:0 6px 6px 0;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:8px 14px;border-radius:2px;
  }
  nav button:hover{border-color:var(--signal);color:var(--signal)}
  nav button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  nav button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  .stage{font-size:0}
  .stage>.col-a{display:inline-block;vertical-align:top;width:372px;font-size:14px}
  .stage>.col-b{display:inline-block;vertical-align:top;width:calc(100% - 412px);margin-left:36px;font-size:14px}

  .device{background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:3px}
  .stage.wide>.col-a{width:58%}
  .stage.wide>.col-b{width:39%;margin-left:3%}
  .stage.wide .scope>div{width:100%;border-right:0}
  .stage.wide .scope>div:first-child{border-bottom:1px solid var(--line)}
  .screen{width:100%;height:604px;overflow:hidden;border-radius:12px;position:relative}
  .device.wide .screen{height:auto;border-radius:4px}
  .devlabel{font-size:12px;color:var(--muted);margin-bottom:9px;letter-spacing:.02em}

  .surface-title{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:21px;font-weight:600;margin-bottom:6px}
  .surface-sub{color:var(--muted);font-size:14px;margin-bottom:22px;max-width:60ch}

  ol.rail{list-style:none;border-left:2px solid var(--line);margin-left:9px}
  ol.rail li{position:relative;padding:0 0 13px 22px;cursor:pointer}
  ol.rail li .num{
    position:absolute;left:-11px;top:1px;width:20px;height:20px;border-radius:11px;
    background:var(--paper);border:2px solid var(--line);color:var(--muted);
    font-size:11px;line-height:17px;text-align:center;font-variant-numeric:tabular-nums;
  }
  ol.rail li .step{display:block;font-size:14.5px;color:var(--muted)}
  ol.rail li .why{display:block;font-size:13.5px;color:var(--muted);max-width:66ch;opacity:0;height:0;overflow:hidden;transition:opacity .18s}
  ol.rail li[aria-current="true"] .num{background:var(--signal);border-color:var(--signal);color:#fff}
  ol.rail li[aria-current="true"] .step{color:var(--ink);font-weight:600}
  ol.rail li[aria-current="true"] .why{opacity:1;height:auto;margin-top:5px;padding-left:1px;border-left:0}
  ol.rail li:focus-visible{outline:2px solid var(--signal);outline-offset:3px}

  .controls{margin-top:20px}
  .controls button{
    font:inherit;font-size:13.5px;cursor:pointer;background:var(--panel);margin-right:8px;
    border:1px solid var(--line);color:var(--ink);padding:8px 15px;border-radius:2px;
  }
  .controls button:hover:not(:disabled){border-color:var(--signal);color:var(--signal)}
  .controls button:disabled{opacity:.4;cursor:default}
  .controls span{font-size:12.5px;color:var(--muted);margin-left:4px}

  .scope{margin-top:26px;border:1px solid var(--line);font-size:0}
  .scope>div{display:inline-block;vertical-align:top;width:50%;font-size:13px}
  .scope div{padding:14px 16px}
  .scope div:first-child{background:var(--signal-soft);border-right:1px solid var(--line)}
  .scope h4{font-size:12.5px;font-weight:700;margin-bottom:8px;color:var(--ink)}
  .scope ul{list-style:none;font-size:13px;color:var(--muted)}
  .scope li{padding:3px 0 3px 13px;position:relative}
  .scope li::before{content:"–";position:absolute;left:0}

  @media (max-width:820px){ .stage>.col-a,.stage>.col-b{width:100%;margin-left:0} .stage>.col-b{margin-top:24px} .scope>div{width:100%} .scope>div:first-child{border-right:0;border-bottom:1px solid var(--line)} }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }

  
  /* ---------- product screens ---------- */
  .s{width:100%;height:100%;font-size:12px}

  /* WhatsApp */
  .wa{background:#ECE5DD;height:100%}
  .wa-h{background:#075E54;padding:11px 13px;color:#fff}
  .wa-h b{font-size:13px} .wa-h i{display:block;font-style:normal;font-size:10px;color:#a8d5cd;margin-top:2px}
  .wa-b{padding:11px}
  .inb,.outb{border-radius:9px;padding:9px 11px;font-size:12px;margin-bottom:8px;line-height:1.45}
  .inb{background:#fff;max-width:255px}
  .outb{background:#DCF8C6;max-width:150px;margin-left:105px}
  .btnr{background:#fff;border-radius:9px;max-width:255px;margin-bottom:8px;overflow:hidden}
  .btnr span{display:block;text-align:center;color:#0a7cff;font-weight:700;padding:8px 0;border-top:1px solid #eee}
  .btnr span:first-child{border-top:0}
  .payc{background:#fff;border-radius:9px;padding:11px;max-width:255px;margin-bottom:8px}
  .payc em{font-style:normal;font-size:10.5px;color:#8a8378}
  .payc b{display:block;font-size:19px;margin:3px 0 8px}
  .payc u{display:block;text-decoration:none;text-align:center;background:#128C7E;color:#fff;font-weight:700;border-radius:7px;padding:8px 0}
  .qr{background:#fff;height:100%;padding:26px 22px;text-align:center}
  .qr h5{font-size:15px;margin-top:20px}
  .qr p{font-size:12px;color:#7d7668;margin-top:7px}
  /* YouTube mobile */
  .yt{background:#fff;height:100%;color:#0f0f0f;font-size:11px}
  .yt .player{position:relative;width:100%;background:#000;overflow:hidden}
  .yt .player img.frame{display:block;width:100%}
  .yt .livebadge{position:absolute;top:8px;left:8px;background:#cc0000;color:#fff;font-size:8px;font-weight:700;padding:2px 5px;border-radius:2px;letter-spacing:.06em}
  .yt .pbar{position:absolute;left:0;right:0;bottom:0;height:2.5px;background:rgba(255,255,255,.28)}
  .yt .pbar i{position:absolute;left:0;top:0;bottom:0;width:88%;background:#ff0000;font-style:normal}
  .yt .pbar em{position:absolute;left:88%;top:-2.5px;width:8px;height:8px;border-radius:5px;background:#ff0000;font-style:normal}
  /* burned-in L band */
  .yt .lband{position:absolute;right:0;top:0;bottom:0;width:62px;background:rgba(16,12,9,.80);padding:7px 4px 0;text-align:center}
  .yt .lband img{width:46px;height:46px;background:#fff;padding:3px;display:block;margin:0 auto}
  .yt .lband em{font-style:normal;display:block;font-size:6px;color:#ffe6c2;margin-top:5px;line-height:1.4;letter-spacing:.03em;font-weight:700}
  .yt .lband span{display:block;font-size:5.5px;color:#c9bda9;margin-top:4px;line-height:1.35}
  .yt .bband{position:absolute;left:0;right:62px;bottom:2.5px;background:rgba(16,12,9,.80);color:#fff;font-size:8px;padding:5px 8px;line-height:1.35}
  .yt .bband b{color:#ffc477;font-size:8.5px}
  /* meta */
  .yt .title{padding:11px 12px 0;font-size:13px;font-weight:600;line-height:1.35}
  .yt .sub{padding:5px 12px 10px;font-size:10px;color:#606060}
  .yt .chan{position:relative;padding:0 12px 11px;border-bottom:1px solid #eee;font-size:0}
  .yt .chan img{width:32px;height:32px;border-radius:18px;display:inline-block;vertical-align:middle}
  .yt .chan .who{display:inline-block;vertical-align:middle;margin-left:9px;font-size:11px}
  .yt .chan .who b{display:block;font-size:11.5px;font-weight:600}
  .yt .chan .who i{font-style:normal;display:block;font-size:9.5px;color:#606060;margin-top:2px}
  .yt .chan .sb{position:absolute;right:12px;top:4px;background:#0f0f0f;color:#fff;font-size:9.5px;font-weight:600;border-radius:16px;padding:6px 12px}
  .yt .chips{padding:10px 12px;border-bottom:1px solid #eee;font-size:0;white-space:nowrap;overflow:hidden}
  .yt .chips span{display:inline-block;background:#f2f2f2;border-radius:15px;font-size:9.5px;padding:6px 11px;margin-right:6px;color:#0f0f0f}
  .yt .desc{margin:10px 12px;background:#f2f2f2;border-radius:10px;padding:10px 11px;font-size:10px;color:#0f0f0f;line-height:1.55}
  .yt .desc a{color:#065fd4;text-decoration:none;font-weight:600}
  .yt .desc s{text-decoration:none;color:#606060}
  .yt .chat{margin:0 12px 10px;border:1px solid #eee;border-radius:10px;padding:9px 11px;font-size:10px;color:#0f0f0f}
  .yt .chat i{font-style:normal;float:right;color:#606060}
  .yt .cmt{margin:0 12px;font-size:0}
  .yt .cmt img{width:22px;height:22px;border-radius:12px;display:inline-block;vertical-align:top}
  .yt .cmt .c{display:inline-block;vertical-align:top;width:calc(100% - 30px);margin-left:8px;font-size:9.5px;line-height:1.5}
  .yt .cmt .c em{font-style:normal;color:#606060;display:block;margin-bottom:2px}
  .yt .cmt .c em b{color:#0f0f0f}
  /* guru page */
  .gp{background:#faf7f0;height:100%}
  .gp-h{background:#2a2620;padding:16px 15px;color:#fff}
  .gp-h .av{width:40px;height:40px;border-radius:24px;background:#b3622f;display:inline-block;vertical-align:middle}
  .gp-h .tx{display:inline-block;vertical-align:middle;margin-left:10px}
  .gp-h b{font-size:14px} .gp-h i{font-style:normal;display:block;font-size:10.5px;color:#a39a89;margin-top:3px}
  .gp-b{padding:15px}
  .gp-b .about{font-size:12px;color:#6d6659;line-height:1.55}
  .gp-b .dak{font-size:13px;margin-top:12px}
  .cta{display:block;text-align:center;background:#128C7E;color:#fff;font-weight:700;border-radius:20px;padding:11px 0;margin-top:14px;font-size:13px}
  .lnk{display:block;text-align:center;color:#5f5949;border:1px solid #ddd6c8;border-radius:20px;padding:10px 0;margin-top:9px;font-size:12.5px}
  .otp{margin-top:16px}
  .otp .fld{background:#fff;border:1px solid #ddd6c8;border-radius:8px;padding:11px;font-size:13px;color:#2a2620}
  .otp .digits{margin-top:10px}
  .otp .digits i{display:inline-block;width:38px;height:44px;border:1px solid #ddd6c8;border-radius:8px;background:#fff;margin-right:7px;text-align:center;line-height:44px;font-style:normal;font-size:17px;font-weight:700}
  .sec{font-size:10.5px;color:#a39a89;letter-spacing:.08em;font-weight:700;margin:6px 0 9px}
  .bk{background:#fff;border:1px solid #e8e0cf;border-radius:12px;padding:12px}
  .bk b{font-size:13.5px;display:block} .bk i{font-style:normal;font-size:11.5px;color:#7d7668;display:block;margin-top:4px}
  .bk .row{margin-top:11px}
  .bk .row u{text-decoration:none;display:inline-block;background:#b3622f;color:#fff;font-weight:700;font-size:11.5px;border-radius:16px;padding:7px 15px}
  .bk .row s{text-decoration:none;display:inline-block;border:1px solid #ddd6c8;color:#5f5949;font-size:11.5px;border-radius:16px;padding:7px 13px;margin-left:6px}
  .past{background:#f4f1ea;border:1px solid #ebe5d8;border-radius:11px;padding:10px 12px;margin-top:8px}
  .past b{font-size:12px;color:#5f5949;display:block} .past i{font-style:normal;font-size:10.5px;color:#8a8378}

  /* on-site booking */
  .gp .avail{margin-top:16px}
  .gp .avail p.h{font-size:10.5px;color:#A39A89;letter-spacing:.07em;font-weight:700;margin-bottom:9px}
  .gp .slot{display:block;background:#fff;border:1px solid #E4DBC9;border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:0}
  .gp .slot b{display:inline-block;font-size:13px;font-weight:600;color:#231F19}
  .gp .slot i{font-style:normal;display:inline-block;font-size:11px;color:#8A8378;margin-left:7px}
  .gp .slot u{text-decoration:none;float:right;font-size:11px;font-weight:700;color:#9C5A2C}
  .gp .more{display:block;text-align:center;font-size:11.5px;color:#8A8378;padding:9px 0}
  .gp .orline{text-align:center;font-size:10px;color:#B0A794;margin:13px 0 11px;letter-spacing:.08em}
  .gp .wapp{display:block;text-align:center;background:#fff;border:1px solid #CFE4DC;color:#0B6B57;font-size:12.5px;font-weight:600;border-radius:22px;padding:11px 0}
  .sheetwrap{position:relative;height:100%;background:#EFEAE0;overflow:hidden}
  .sheetwrap .behind{position:absolute;left:0;right:0;top:0;bottom:0}
  .sheetwrap .behind .s{height:100%}
  .sheetwrap .dim{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(35,31,25,.42)}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:18px 17px 20px}
  .sheet .grab{width:34px;height:4px;border-radius:3px;background:#E2DBCE;margin:0 auto 14px}
  .sheet h6{font-size:15px;font-weight:600;color:#231F19}
  .sheet .when{font-size:12px;color:#7C756A;margin-top:5px}
  .sheet .fld{margin-top:15px;border:1px solid #DDD5C6;border-radius:10px;padding:11px 12px;font-size:13px;color:#231F19}
  .sheet .fld em{font-style:normal;display:block;font-size:9.5px;color:#A39A89;margin-bottom:4px;letter-spacing:.05em}
  .sheet .note{font-size:10.5px;color:#8A8378;margin-top:9px;line-height:1.5}
  .sheet .pay{display:block;text-align:center;background:#9C5A2C;color:#fff;font-size:13.5px;font-weight:700;border-radius:24px;padding:13px 0;margin-top:14px}
  .sheet .held{text-align:center;font-size:10px;color:#A39A89;margin-top:10px}
  .upi{background:#fff;height:100%;padding:0}
  .upi .top{background:#231F19;color:#fff;padding:15px 16px}
  .upi .top b{font-size:12.5px;display:block}
  .upi .top i{font-style:normal;font-size:10.5px;color:#A9A192;display:block;margin-top:4px}
  .upi .amt{text-align:center;padding:22px 0 6px;font-size:28px;font-weight:600;color:#231F19}
  .upi .to{text-align:center;font-size:11px;color:#7C756A;padding-bottom:18px;border-bottom:1px solid #F0EBE0}
  .upi .apps{padding:14px 16px}
  .upi .apps p{font-size:10px;color:#A39A89;letter-spacing:.06em;font-weight:700;margin-bottom:10px}
  .upi .app{border:1px solid #E7E0D2;border-radius:11px;padding:11px 12px;margin-bottom:8px;font-size:12.5px;color:#231F19}
  .upi .app span{display:inline-block;width:24px;height:24px;border-radius:14px;vertical-align:-7px;margin-right:10px}
  .upi .app i{font-style:normal;float:right;font-size:10.5px;color:#A39A89;margin-top:2px}
  .done{background:#F4F1EA;height:100%;padding:40px 24px 24px;text-align:center}
  .done .tick{width:54px;height:54px;border-radius:30px;background:#E4EFE8;color:#2C6B4D;font-size:26px;line-height:54px;margin:0 auto}
  .done h5{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:20px;font-weight:600;margin-top:16px;color:#231F19}
  .done .det{background:#fff;border:1px solid #E7E0D2;border-radius:12px;padding:13px;margin-top:18px;text-align:left}
  .done .det div{font-size:11.5px;color:#7C756A;padding:4px 0}
  .done .det div b{color:#231F19;float:right;font-weight:600}
  .done .msg{font-size:11.5px;color:#7C756A;margin-top:16px;line-height:1.6}
  .done .ghost2{display:block;text-decoration:none;color:#6B6459;border:1px solid #DDD5C6;border-radius:22px;padding:11px 0;margin-top:18px;font-size:12.5px}
  /* guruji calendar */
  .cal{background:#faf7f0;height:100%;padding:24px 18px}
  .cal .d{font-size:10.5px;color:#a39a89;letter-spacing:.12em}
  .cal h5{font-size:21px;margin-top:7px}
  .cal .n{font-size:12px;color:#8a8378;margin-top:5px;margin-bottom:22px}
  .tl{border-left:2px solid #e8e0cf;margin-left:52px;padding-left:16px;position:relative;padding-bottom:26px}
  .tl .t{position:absolute;left:-108px;width:84px;text-align:right;font-size:11.5px;color:#a39a89}
  .tl .dot{position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:6px}
  .tl .k{font-size:10px;font-weight:700;letter-spacing:.09em;color:#a39a89}
  .tl b{display:block;font-size:15.5px;margin-top:6px}
  .tl i{font-style:normal;display:block;font-size:12px;color:#7d7668;margin-top:4px;line-height:1.5}
  .tl u{text-decoration:none;display:block;width:170px;text-align:center;background:#b3622f;color:#fff;font-weight:700;font-size:12.5px;border-radius:20px;padding:9px 0;margin-top:11px}
  .tl .vn{background:#fff;border:1px solid #e8e0cf;border-radius:20px;padding:7px 12px;font-size:11.5px;color:#5f5949;display:inline-block;margin-top:9px}
  .cal .rest{font-size:11px;color:#c4bba8;margin-left:52px;padding-left:16px;border-left:2px solid #e8e0cf;padding-bottom:26px}

  /* ---- devotee session: quiet, warm, spacious ---- */
  .q{background:#F4F1EA;height:100%;padding:40px 26px 26px;text-align:center;color:#231F19}
  .q .eyebrow{font-size:11px;color:#9A9285;letter-spacing:.14em}
  .q h5{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:22px;font-weight:600;margin-top:12px;line-height:1.3}
  .q .lede{font-size:12.5px;color:#7C756A;margin-top:10px;line-height:1.6}
  .q .selfie{width:96px;height:96px;border-radius:56px;background:#E4DDD0;margin:34px auto 0;position:relative}
  .q .selfie:after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:20px;background:#CFC5B4}
  .q .selfnote{font-size:11px;color:#9A9285;margin-top:12px}
  .q .checks{margin-top:30px;text-align:left;display:inline-block}
  .q .checks div{font-size:12px;color:#7C756A;padding:6px 0}
  .q .checks em{font-style:normal;color:#3E7D5F;margin-right:9px;font-weight:700}
  .q .statusline{font-size:13.5px;color:#231F19;margin-top:34px;line-height:1.55}
  .q .statusline b{font-weight:600}
  .q .hair{height:1px;background:#E2DBCE;margin:30px 44px}
  .q .privacy{font-size:11.5px;color:#9A9285;line-height:1.65}
  .q .primary{display:block;text-decoration:none;background:#9C5A2C;color:#fff;font-size:13.5px;font-weight:600;border-radius:26px;padding:13px 0;margin-top:26px}
  .q .ghost{display:block;text-decoration:none;color:#6B6459;font-size:13px;border:1px solid #DDD5C6;border-radius:26px;padding:12px 0;margin-top:10px}
  .q .fromteam{background:#fff;border:1px solid #E7E0D2;border-radius:12px;padding:12px 14px;margin-top:26px;text-align:left}
  .q .fromteam em{font-style:normal;font-size:10.5px;color:#9A9285;letter-spacing:.06em;display:block}
  .q .fromteam span{font-size:12.5px;color:#231F19;display:block;margin-top:5px;line-height:1.5}

  /* the room */
  .rm{background:#17150F;height:100%;position:relative;color:#F2ECE0}
  .rm .stage{height:100%;background:#241F18}
  .rm .face{width:112px;height:112px;border-radius:64px;background:#3C352B;position:absolute;left:50%;top:44%;margin:-56px 0 0 -56px}
  .rm .name{position:absolute;left:18px;top:18px;font-size:12.5px;color:#EBE3D5;letter-spacing:.02em}
  .rm .self{position:absolute;right:16px;top:16px;width:72px;height:96px;border-radius:10px;background:#332C23;border:1px solid #453D31}
  .rm .quiet{position:absolute;left:0;right:0;bottom:96px;text-align:center;font-size:11px;color:#8B8272}
  .rm .ctrl{position:absolute;left:0;right:0;bottom:26px;text-align:center}
  .rm .ctrl s,.rm .ctrl u{text-decoration:none;display:inline-block;width:46px;height:46px;border-radius:26px;margin:0 6px;background:#332C23;border:1px solid #453D31}
  .rm .ctrl u{background:#8E3120;border-color:#8E3120}

  /* ---- console ---- */
  .cs{background:#EFEDE7;font-size:0;min-height:430px}
  .cs .nav{display:inline-block;vertical-align:top;width:142px;background:#221E18;padding:14px 9px;color:#A9A192;font-size:11px;min-height:430px}
  .cs .nav b{color:#fff;font-size:11.5px;display:block;padding:3px 8px 15px}
  .cs .nav div{padding:7px 8px;border-radius:6px;font-size:11px;margin-bottom:1px}
  .cs .nav div.on{background:#3A322A;color:#fff;font-weight:700}
  .cs .nav div span{float:right;background:#8E3120;color:#fff;border-radius:8px;font-size:9px;padding:0 5px;font-weight:700}
  .cs .main{display:inline-block;vertical-align:top;width:calc(100% - 146px);padding:14px 16px;font-size:11px}
  .cs .bar{margin-bottom:12px}
  .cs .bar b{font-size:14.5px} .cs .bar i{font-style:normal;font-size:10.5px;color:#8A8378;margin-left:8px}
  .cs .bar u{text-decoration:none;float:right;background:#9C5A2C;color:#fff;font-weight:700;font-size:10.5px;border-radius:6px;padding:6px 11px}
  .cs .alert{background:#FBF0E2;border:1px solid #EBD9C0;border-radius:8px;padding:8px 11px;font-size:10.5px;color:#8A5320;margin-bottom:11px}
  .cs .alert s{text-decoration:none;float:right;font-weight:700;color:#8A5320}
  .cs .kpis{margin-bottom:12px;font-size:0}

  .cs .kpi:last-child{margin-right:0}
  .cs .kpi em{font-style:normal;font-size:9px;color:#8A8378;letter-spacing:.05em;display:block}
  .cs .kpi b{font-size:16px;display:block;margin-top:3px}
  .cs .cols{font-size:0}
  .cs .p{display:inline-block;vertical-align:top;background:#fff;border:1px solid #E4DFD4;border-radius:9px;padding:11px 13px;font-size:11px;width:100%;margin-bottom:10px}
  .cs .cols.split .p{width:57%;margin-right:3%}
  .cs .cols.split .p+.p{width:40%;margin-right:0}
  .cs .p h6{font-size:11.5px;margin-bottom:9px}
  .cs .p h6 i{font-style:normal;float:right;font-size:10px;color:#8A8378;font-weight:400}
  .cs table{width:100%;border-collapse:collapse}
  .cs th{text-align:left;font-size:9px;color:#8A8378;padding:4px;border-bottom:1px solid #EFE9DC;letter-spacing:.05em}
  .cs td{font-size:10.5px;padding:7px 4px;border-bottom:1px solid #F5F1E7}
  .cs .tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:7px;white-space:nowrap}

  .cs .n{background:#EDEBE6;color:#6D6659} .cs .r{background:#F8E4E0;color:#8E3120}

  .wk{font-size:0;margin-bottom:4px}

  .wk div:last-child{margin-right:0}

  .wk div i{font-style:normal;display:block;font-size:9px;color:#8A8378;margin-top:2px}

  .wk div.full b{color:#2C6B4D}

  .gcal table{width:100%;border-collapse:collapse;table-layout:fixed}

  .gcal th b{display:block;font-size:11.5px;color:#231F19;font-weight:600;margin-top:2px}
  .gcal th i{font-style:normal;display:block;font-size:8px;color:#A39A89;margin-top:2px}
  .gcal th.cl b,.gcal th.cl i{color:#B7AF9F}
  .gcal td{border-bottom:1px solid #F5F1E7;border-right:1px solid #F5F1E7;height:25px;padding:1px 2px;vertical-align:top}
  .gcal td.tcol{border-right:1px solid #EFE9DC;font-size:8px;color:#A39A89;text-align:right;padding:3px 6px 0 0;width:42px}

function gkey(c, tm){
  var evening = (tm.charAt(0) === '4' || tm.charAt(0) === '5');
  var t = evening ? (tm === '4:00' ? '16:00' : (tm === '4:30' ? '16:30' : '17:00')) : tm;
  return c + '|' + t;
}
function gfill(c){
  var total = 0, taken = 0;
  for (var r = 0; r < GTIMES.length; r++) {
    var tm = GTIMES[r];
    var evening = (tm.charAt(0) === '4' || tm.charAt(0) === '5');
    if (evening && !GEVENING[c]) { continue; }
    total++;
    if (GEV[gkey(c, tm)]) { taken++; }
  }
  return taken + ' of ' + total;
}
function gridHtml(){
  var h = '<div class="gcal"><table><tr><th></th>';
  for (var d = 0; d < GDAYS.length; d++) {

       + (g.closed ? g.closed : gfill(d)) + '</i></th>';
  }
  h += '</tr>';
  for (var r = 0; r < GTIMES.length; r++) {
    var tm = GTIMES[r];
    if (tm === '4:00') {
      h += '<tr class="divider"><td colspan="8">afternoon \u2014 rest</td></tr>';
    }
    var evening = (tm.charAt(0) === '4' || tm.charAt(0) === '5');
    h += '<tr><td class="tcol">' + tm + '</td>';
    for (var c = 0; c < GDAYS.length; c++) {
      var day = GDAYS[c];
      if (day.closed) { h += '<td class="shut"></td>'; continue; }
      if (evening && !GEVENING[c]) { h += '<td class="none"></td>'; continue; }
      var e = GEV[gkey(c, tm)];
      if (e) {
        h += '<td><div class="ev ' + e.s + '"><b>' + e.n + '</b>' + e.t + '</div></td>';
      } else {
        h += '<td><div class="open">open</div></td>';

    }
    h += '</tr>';
  }
  h += '</table><p class="legend"><i style="background:#9C5A2C"></i>paid<i style="background:#D9A05B"></i>payment not finished'

}

      {s:'Needs attention \u2014 where money used to leak', why:'A hold that expired, someone no slot suited, a devotee who paid and never joined, a refund on its way. Every one of these was invisible in the notebook.', screen:'csAttention'},
      {s:'Money, without adding anything up', why:'Every entry as it happened, what has been returned, and what settles on Friday. Live-sourced bookings are marked, because that is what the pilot is judged on.', screen:'csMoney'}
    ]
  },
  {
    tab:'5 \u00b7 The session',
    title:'The waiting room, and the session',
    sub:'Everything else is scheduling. This is the half hour she paid for \u2014 so it is quiet, warm and almost empty. That restraint is the point.',
    device:'Her phone',
    inv1:['A check before she enters \u2014 mic, camera, connection, and how she will look','A waiting room that tells her the truth in words, not a countdown','Messages from his team, shown gently in the same screen','A browser room on an established SDK; audio holds when video drops','The ten-minute way out: another time, or the dakshina back','A closing screen \u2014 what happened, and when the next satsang is'],
    notv1:['No recording \u2014 it changes the promise, and needs his consent','No chat, screen share or files in the room','No group rooms; those arrive with paid sessions','No native app \u2014 the room is a browser page','No transcripts, notes or ratings afterwards'],
    steps:[
      {s:'Before she enters', why:'Her session named, thirty minutes stated, and the three things that ruin a call checked while it still costs nothing to fix them. She also sees how she will look, which quietly settles nerves.', screen:'wrCheck'},
      {s:'Waiting, told the truth', why:'\u201cGuruji is with someone before you. You are next \u2014 about five minutes.\u201d Words, not a timer that runs out and leaves her guessing. Almost nothing else on screen.', screen:'wrWait'},
      {s:'His team can reach her here', why:'One line, in the same calm frame: he is running late, ten more minutes. She learns it from the screen instead of wondering, and nobody has to call her.', screen:'wrWait'},
      {s:'The session itself', why:'Him, her small self-view, three controls, and one line that matters: only the two of you, nothing recorded. No chat, no share, nothing to press by mistake.', screen:'wrRoom'},
      {s:'If he cannot come', why:'Ten minutes past, two clear choices, settled at once. Our worst moment, handled without her chasing anyone \u2014 this screen is why she trusts us the next time.', screen:'wrEscape'},
      {s:'Afterwards', why:'What happened, when the next satsang is, and a quiet way to book again. No rating, no survey \u2014 nothing that turns a darshan into a transaction at the end.', screen:'wrEnd'}
    ]
  }
];

/* ---------- wiring ---------- */
var si = 0, pi = 0;
function $(id){ return document.getElementById(id); }

function renderTabs(){
  var html = '';
  for (var i = 0; i < SURFACES.length; i++) {
    html += '<button role="tab" aria-selected="' + (i === si) + '" data-i="' + i + '">' + SURFACES[i].tab + '</button>';
  }
  $('tabs').innerHTML = html;
  var bs = $('tabs').getElementsByTagName('button');
  for (var j = 0; j < bs.length; j++) {
    bs[j].onclick = function(){ si = parseInt(this.getAttribute('data-i'), 10); pi = 0; render(); };
  }
}

function render(){
  var s = SURFACES[si], step = s.steps[pi];
  renderTabs();
  $('stitle').innerHTML = s.title;
  $('ssub').innerHTML = s.sub;
  $('devlabel').innerHTML = s.device;
  $('stage').className = 'stage' + (s.wide ? ' wide' : '');
  $('device').className = 'device' + (s.wide ? ' wide' : '');
  $('screen').innerHTML = SCREENS[step.screen]();

  var rail = '';
  for (var i = 0; i < s.steps.length; i++) {
    rail += '<li tabindex="0" data-i="' + i + '" aria-current="' + (i === pi) + '">'
         +  '<span class="num">' + (i + 1) + '</span>'
         +  '<span class="step">' + s.steps[i].s + '</span>'
         +  '<span class="why">' + s.steps[i].why + '</span></li>';
  }
  $('rail').innerHTML = rail;
  var lis = $('rail').getElementsByTagName('li');
  for (var k = 0; k < lis.length; k++) {
    lis[k].onclick = function(){ pi = parseInt(this.getAttribute('data-i'), 10); render(); };
    lis[k].onkeydown = function(e){
      if (e.keyCode === 13 || e.keyCode === 32) { e.preventDefault(); pi = parseInt(this.getAttribute('data-i'), 10); render(); }
    };
  }

  var a = '', b = '';
  for (var m = 0; m < s.inv1.length; m++) { a += '<li>' + s.inv1[m] + '</li>'; }
  for (var n = 0; n < s.notv1.length; n++) { b += '<li>' + s.notv1[n] + '</li>'; }
  $('inv1').innerHTML = a;
  $('notv1').innerHTML = b;

  $('prev').disabled = (pi === 0);
  $('next').disabled = (pi === s.steps.length - 1);
  $('count').innerHTML = 'Step ' + (pi + 1) + ' of ' + s.steps.length;
}

$('prev').onclick = function(){ if (pi > 0) { pi--; render(); } };
$('next').onclick = function(){ if (pi < SURFACES[si].steps.length - 1) { pi++; render(); } };
document.onkeydown = function(e){
  if (e.keyCode === 39 && pi < SURFACES[si].steps.length - 1) { pi++; render(); }
  if (e.keyCode === 37 && pi > 0) { pi--; render(); }
};
render();
</script>
